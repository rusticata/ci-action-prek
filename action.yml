---
name: 'prek'
description: 'Install and run prek checks'
inputs:
  prek-version:
    description: 'prek version to use'
    default: "0.2.1"
runs:
  using: "composite"
  steps:
    - name: Install prek
      shell: bash
      env:
        PREK_VERSION: ${{inputs.prek-version}}
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf https://github.com/j178/prek/releases/download/v${PREK_VERSION}/prek-installer.sh | sh
      working-directory: ${{ github.workspace }}
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/.cache/prek
        key: prek-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
    - name: Run prek
      shell: bash
      run: prek --all-files --verbose --hook-stage manual
